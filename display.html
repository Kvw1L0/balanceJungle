<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Balance - The Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --jungle-yellow: #f1c40f; --jungle-black: #050505; --text-light: #ecf0f1;
            --font-header: 'Anton', sans-serif;
            --sinuous-border-bar: 25px 10px 25px 10px / 10px 25px 10px 25px;
        }

        body { 
            font-family: 'Poppins', sans-serif; background-color: var(--jungle-black); 
            background-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(10,30,10,0.9) 100%), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiMyMjMxMjIiIGZpbGwtb3BhY2l0eT0iMC4zIj48cGF0aCBkPSJNMTAgMTBoMjB2MjBIMTB6bTIgMmgxNnYxNkgxMnoiLz48cGF0aCBkPSJNNTAgNTBoMjB2MjBINTB6bTIgMmgxNnYxNkg1MnoiLz48L2c+PC9nPjwvc3ZnPg==');
            color: var(--text-light); text-align: center; overflow: hidden; margin: 0; padding: 40px 20px; box-sizing: border-box; min-height: 100vh;
        }

        h1 { font-family: var(--font-header); font-size: 4rem; margin-bottom: 60px; color: var(--jungle-yellow); text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px rgba(241, 196, 15, 0.6); margin-top: 0; }
        #contenedor-barras { display: flex; flex-direction: column; gap: 35px; max-width: 900px; margin: 0 auto; }
        .pista-jugador { display: flex; align-items: center; gap: 25px; font-family: var(--font-header); font-size: 2rem; color: var(--jungle-yellow); background: rgba(26, 26, 26, 0.5); padding: 10px 25px; border-radius: 15px; }
        
        /* Modificado para que los nombres encajen bien */
        .nombre-label { width: 150px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .barra-fondo { flex-grow: 1; height: 60px; background: var(--jungle-black); border-radius: var(--sinuous-border-bar); overflow: hidden; border: 3px solid #333; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); position: relative; }
        .barra-relleno { height: 100%; width: 0%; background: linear-gradient(90deg, #b7950b 0%, var(--jungle-yellow) 100%); transition: width 0.05s linear; border-radius: var(--sinuous-border-bar); box-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .llenando-activa { box-shadow: 0 0 25px rgba(241, 196, 15, 0.8); }

        #ganador-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #ganador-overlay h2 { font-family: var(--font-header); font-size: 6rem; color: var(--jungle-yellow); text-transform: uppercase; margin: 0; text-shadow: 0 0 30px var(--jungle-yellow); }
        #ganador-overlay p { font-size: 2rem; }
    </style>
</head>
<body>

    <h1 id="titulo">Esperando Exploradores...</h1>
    <div id="contenedor-barras"></div>

    <div id="ganador-overlay" onclick="resetUI()">
        <p>CONQUISTADOR DE LA JUNGLA</p>
        <h2 id="ganador-texto"></h2>
        <p style="font-size: 1rem; opacity: 0.7; margin-top: 30px;">Haz click para continuar</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxwWTtG5Q30H6YAucKMtNAalLer_ShV6k",
            authDomain: "jungle-balance.firebaseapp.com",
            databaseURL: "https://jungle-balance-default-rtdb.firebaseio.com",
            projectId: "jungle-balance",
            storageBucket: "jungle-balance.firebasestorage.app",
            messagingSenderId: "279642328604",
            appId: "1:279642328604:web:8b24a3541f11ad8ca8d9d9",
            measurementId: "G-BR2M1Y2JZF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let configJuego = { estado: 'esperando', cantidadJugadores: 0, tiempoLimiteSecs: 10, nombres: {} };
        let estadoSensores = { p1: false, p2: false, p3: false, p4: false };
        let progresoJugadores = { p1: 0, p2: 0, p3: 0, p4: 0 };
        let animationFrameId;

        db.ref('juego/config').on('value', snap => {
            if(snap.exists()){
                configJuego = snap.val();
                if(configJuego.estado === 'jugando') {
                    iniciarRonda();
                } else if (configJuego.estado === 'esperando') {
                    document.getElementById('titulo').innerText = "Esperando Exploradores...";
                    document.getElementById('contenedor-barras').innerHTML = '';
                    document.getElementById('ganador-overlay').style.display = 'none';
                }
            }
        });

        db.ref('juego/jugadores').on('value', snap => {
            if(snap.exists() && configJuego.estado === 'jugando') {
                const data = snap.val();
                estadoSensores.p1 = data.p1 ? data.p1.estaLlenando : false;
                estadoSensores.p2 = data.p2 ? data.p2.estaLlenando : false;
                estadoSensores.p3 = data.p3 ? data.p3.estaLlenando : false;
                estadoSensores.p4 = data.p4 ? data.p4.estaLlenando : false;
            }
        });

        function iniciarRonda() {
            document.getElementById('titulo').innerText = "¡MANTÉN EL EQUILIBRIO!";
            document.getElementById('ganador-overlay').style.display = 'none';
            progresoJugadores = { p1: 0, p2: 0, p3: 0, p4: 0 };
            
            const contenedor = document.getElementById('contenedor-barras');
            contenedor.innerHTML = '';
            for(let i = 1; i <= configJuego.cantidadJugadores; i++) {
                // Obtener el nombre de la configuración, o usar genérico
                let nombreJugador = configJuego.nombres[`p${i}`] || `P${i}`;
                
                contenedor.innerHTML += `
                    <div class="pista-jugador">
                        <span class="nombre-label">${nombreJugador}</span>
                        <div class="barra-fondo">
                            <div id="barra-p${i}" class="barra-relleno"></div>
                        </div>
                    </div>
                `;
            }

            cancelAnimationFrame(animationFrameId);
            actualizarBarras();
        }

        function actualizarBarras() {
            if (configJuego.estado !== "jugando") return;

            const incremento = 100 / (configJuego.tiempoLimiteSecs * 60);

            for (let i = 1; i <= configJuego.cantidadJugadores; i++) {
                let p = `p${i}`;
                const barNode = document.getElementById(`barra-${p}`);
                
                if (estadoSensores[p]) {
                    progresoJugadores[p] += incremento;
                    barNode.style.width = progresoJugadores[p] + '%';
                    barNode.classList.add('llenando-activa');

                    if (progresoJugadores[p] >= 100) {
                        declararGanador(i);
                        return;
                    }
                } else {
                    barNode.classList.remove('llenando-activa');
                }
            }
            
            animationFrameId = requestAnimationFrame(actualizarBarras);
        }

        function declararGanador(numeroJugador) {
            configJuego.estado = "terminado";
            
            // Mostrar Overlay con el Nombre real
            let nombreGanador = configJuego.nombres[`p${numeroJugador}`] || `JUGADOR ${numeroJugador}`;
            document.getElementById('ganador-texto').innerText = nombreGanador;
            document.getElementById('ganador-overlay').style.display = 'flex';
            
            var duration = 4 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f1c40f', '#b7950b', '#ffffff'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f1c40f', '#b7950b', '#ffffff'] });
                confetti({ particleCount: 3, angle: 90, spread: 80, origin: { x: 0.5, y: 0 }, colors: ['#000000', '#333333'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function resetUI() {
            db.ref('juego/config/estado').set('esperando');
        }
    </script>
</body>
</html>
