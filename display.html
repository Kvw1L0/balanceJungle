<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Balance - The Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --jungle-yellow: #f1c40f;
            --jungle-green: #2ecc71;
            --jungle-red: #e74c3c;
            --jungle-black: #050505;
            --text-light: #ecf0f1;
            --font-header: 'Anton', sans-serif;
            --sinuous-border-bar: 25px 10px 25px 10px / 10px 25px 10px 25px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--jungle-black);
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(10, 30, 10, 0.9) 100%), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiMyMjMxMjIiIGZpbGwtb3BhY2l0eT0iMC4zIj48cGF0aCBkPSJNMTAgMTBoMjB2MjBIMTB6bTIgMmgxNnYxNkgxMnoiLz48cGF0aCBkPSJNNTAgNTBoMjB2MjBINTB6bTIgMmgxNnYxNkg1MnoiLz48L2c+PC9nPjwvc3ZnPg==');
            color: var(--text-light);
            text-align: center;
            overflow-x: hidden;
            margin: 0;
            padding: 30px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .meta-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill {
            background: rgba(241, 196, 15, 0.14);
            border: 1px solid rgba(241, 196, 15, 0.5);
            color: var(--jungle-yellow);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-sound {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
        }

        h1 {
            font-family: var(--font-header);
            font-size: clamp(2.4rem, 5vw, 4rem);
            margin: 10px 0 35px;
            color: var(--jungle-yellow);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 18px rgba(241, 196, 15, 0.55);
        }

        #contenedor-barras {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
        }

        .pista-jugador {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: var(--font-header);
            font-size: 1.8rem;
            color: var(--jungle-yellow);
            background: rgba(26, 26, 26, 0.65);
            padding: 12px 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: opacity 0.3s, border-color 0.3s;
        }

        .pista-jugador.eliminado {
            opacity: 0.45;
            border-color: var(--jungle-red);
        }

        .nombre-label {
            width: 170px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .barra-fondo {
            flex-grow: 1;
            height: 54px;
            background: var(--jungle-black);
            border-radius: var(--sinuous-border-bar);
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .barra-relleno {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b7950b 0%, var(--jungle-yellow) 100%);
            transition: width 0.06s linear;
            border-radius: var(--sinuous-border-bar);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }

        .llenando-activa {
            box-shadow: 0 0 28px rgba(46, 204, 113, 0.85);
            background: linear-gradient(90deg, #27ae60 0%, var(--jungle-yellow) 100%) !important;
        }

        .estado-chip {
            min-width: 130px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 999px;
            background: #222;
            color: #aaa;
            text-transform: uppercase;
        }

        .estado-chip.ok { background: rgba(46, 204, 113, 0.22); color: var(--jungle-green); }
        .estado-chip.wait { background: rgba(241, 196, 15, 0.2); color: var(--jungle-yellow); }
        .estado-chip.dead { background: rgba(231, 76, 60, 0.25); color: var(--jungle-red); }

        #lobby-panel {
            display: none;
            gap: 30px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 950px;
            width: 100%;
            margin-top: 10px;
        }

        .qr-card {
            background: rgba(26, 26, 26, 0.85);
            border: 2px solid var(--jungle-yellow);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        #display-qr {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
        }

        #scoreboard-tv {
            margin-top: 34px;
            background: rgba(26, 26, 26, 0.7);
            border: 1px solid rgba(241, 196, 15, 0.3);
            border-radius: 16px;
            padding: 14px 24px;
            max-width: 600px;
            width: 100%;
            display: none;
        }

        .score-items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        #ganador-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        #ganador-overlay h2 {
            font-family: var(--font-header);
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            color: var(--jungle-yellow);
            text-transform: uppercase;
            margin: 10px 0;
            text-shadow: 0 0 30px var(--jungle-yellow);
        }

        #ganador-overlay p { font-size: 1.6rem; margin: 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="meta-pills">
            <span class="pill" id="pill-modo">MODO: TIEMPO</span>
            <span class="pill" id="pill-dificultad">DIFICULTAD: NORMAL</span>
        </div>
        <button class="btn-sound" id="btn-sound" onclick="toggleAudio()">🔊 Sonido: ON</button>
    </div>

    <h1 id="titulo">Esperando Exploradores...</h1>

    <div id="lobby-panel">
        <div class="qr-card">
            <div style="font-family: var(--font-header); font-size: 1.3rem; color: var(--jungle-yellow); letter-spacing: 1px;">ESCANEÁ PARA UNIRTE</div>
            <div id="display-qr"></div>
            <div id="qr-url-label" style="font-size: 0.75rem; opacity: 0.75;"></div>
        </div>
    </div>

    <div id="contenedor-barras"></div>

    <div id="scoreboard-tv">
        <div style="font-family: var(--font-header); color: var(--jungle-yellow); letter-spacing: 1px; font-size: 1.2rem;">MARCADOR DE SESIÓN</div>
        <div class="score-items" id="score-items"></div>
    </div>

    <div id="ganador-overlay" onclick="resetUI()">
        <p>CONQUISTADOR DE LA JUNGLA</p>
        <h2 id="ganador-texto"></h2>
        <p style="font-size: 1rem; opacity: 0.7; margin-top: 28px;">Haz click para continuar</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxwWTtG5Q30H6YAucKMtNAalLer_ShV6k",
            authDomain: "jungle-balance.firebaseapp.com",
            databaseURL: "https://jungle-balance-default-rtdb.firebaseio.com",
            projectId: "jungle-balance",
            storageBucket: "jungle-balance.firebasestorage.app",
            messagingSenderId: "279642328604",
            appId: "1:279642328604:web:8b24a3541f11ad8ca8d9d9",
            measurementId: "G-BR2M1Y2JZF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let configJuego = { estado: 'esperando', cantidadJugadores: 0, tiempoLimiteSecs: 10, modo: 'tiempo', dificultad: 'normal', nombres: {} };
        let jugadoresData = {};
        let progresoJugadores = { p1: 0, p2: 0, p3: 0, p4: 0 };
        let animationFrameId = null;
        let ultimoFrameMs = 0;
        let rondaActivaId = null;
        let ganadorDeclarado = false;
        let sonidoActivo = true;
        let audioCtx = null;
        let qrInicializado = false;

        function getAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            return audioCtx;
        }

        function toggleAudio() {
            sonidoActivo = !sonidoActivo;
            document.getElementById('btn-sound').innerText = sonidoActivo ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
        }

        function reproducirTono(freq, duracion, tipo = 'sine') {
            if (!sonidoActivo) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = tipo;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracion);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duracion);
        }

        function sonarInicio() {
            reproducirTono(523.25, 0.15, 'triangle');
            setTimeout(() => reproducirTono(659.25, 0.15, 'triangle'), 140);
            setTimeout(() => reproducirTono(783.99, 0.3, 'triangle'), 280);
        }

        function sonarVictoria() {
            [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
                setTimeout(() => reproducirTono(f, 0.25, 'triangle'), idx * 110);
            });
        }

        function generarQRDisplay() {
            if (qrInicializado || typeof QRCode === 'undefined') return;
            const playerUrl = new URL('index.html', window.location.href).href;
            document.getElementById('qr-url-label').innerText = playerUrl;
            const box = document.getElementById('display-qr');
            box.innerHTML = '';
            new QRCode(box, {
                text: playerUrl,
                width: 160,
                height: 160,
                colorDark: '#050505',
                colorLight: '#ffffff'
            });
            qrInicializado = true;
        }

        function actualizarPills() {
            const modoText = configJuego.modo === 'supervivencia' ? 'MODO: ÚLTIMO EN PIE' : `MODO: TIEMPO (${configJuego.tiempoLimiteSecs || 10}s)`;
            document.getElementById('pill-modo').innerText = modoText;
            document.getElementById('pill-dificultad').innerText = `DIFICULTAD: ${(configJuego.dificultad || 'normal').toUpperCase()}`;
        }

        function renderPistas(esLobby) {
            const contenedor = document.getElementById('contenedor-barras');
            contenedor.innerHTML = '';
            const cantidad = configJuego.cantidadJugadores || 0;

            for (let i = 1; i <= cantidad; i++) {
                const pid = `p${i}`;
                const nombreJugador = (configJuego.nombres && configJuego.nombres[pid]) || `Explorador ${i}`;
                contenedor.innerHTML += `
                    <div class="pista-jugador" id="pista-${pid}">
                        <span class="nombre-label">${nombreJugador}</span>
                        <div class="barra-fondo">
                            <div id="barra-${pid}" class="barra-relleno"></div>
                        </div>
                        <span class="estado-chip" id="chip-${pid}">${esLobby ? 'Esperando' : 'Listo'}</span>
                    </div>
                `;
            }
        }

        function actualizarChipsLobby() {
            const cantidad = configJuego.cantidadJugadores || 0;
            for (let i = 1; i <= cantidad; i++) {
                const pid = `p${i}`;
                const j = jugadoresData[pid] || {};
                const chip = document.getElementById(`chip-${pid}`);
                if (!chip) continue;
                if (j.listo) {
                    chip.innerText = 'Calibrado';
                    chip.className = 'estado-chip ok';
                } else if (j.ocupado) {
                    chip.innerText = 'Conectado';
                    chip.className = 'estado-chip wait';
                } else {
                    chip.innerText = 'Esperando';
                    chip.className = 'estado-chip';
                }
            }
        }

        db.ref('juego/config').on('value', snap => {
            if (!snap.exists()) return;
            configJuego = snap.val();
            actualizarPills();

            if (configJuego.estado === 'lobby') {
                rondaActivaId = null;
                ganadorDeclarado = false;
                cancelAnimationFrame(animationFrameId);
                document.getElementById('titulo').innerText = 'Sala Abierta · Escaneá para Jugar';
                document.getElementById('lobby-panel').style.display = 'flex';
                document.getElementById('ganador-overlay').style.display = 'none';
                generarQRDisplay();
                renderPistas(true);
                actualizarChipsLobby();
            } else if (configJuego.estado === 'jugando') {
                document.getElementById('lobby-panel').style.display = 'none';
                const nuevoId = configJuego.iniciadoEn || 'activo';
                if (rondaActivaId !== nuevoId) {
                    rondaActivaId = nuevoId;
                    iniciarRonda();
                }
            } else if (configJuego.estado === 'esperando') {
                rondaActivaId = null;
                ganadorDeclarado = false;
                cancelAnimationFrame(animationFrameId);
                document.getElementById('titulo').innerText = 'Esperando Exploradores...';
                document.getElementById('lobby-panel').style.display = 'none';
                document.getElementById('contenedor-barras').innerHTML = '';
                document.getElementById('ganador-overlay').style.display = 'none';
            }
        });

        db.ref('juego/jugadores').on('value', snap => {
            jugadoresData = snap.val() || {};
            if (configJuego.estado === 'lobby') {
                actualizarChipsLobby();
            } else if (configJuego.estado === 'jugando' && !ganadorDeclarado) {
                verificarSupervivencia();
            }
        });

        db.ref('juego/marcador').on('value', snap => {
            const tvBoard = document.getElementById('scoreboard-tv');
            const itemsNode = document.getElementById('score-items');
            const data = snap.val();
            if (!data) {
                tvBoard.style.display = 'none';
                return;
            }
            const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) {
                tvBoard.style.display = 'none';
                return;
            }
            tvBoard.style.display = 'block';
            itemsNode.innerHTML = entries.map(([nombre, pts]) => `
                <span class="pill">${nombre}: ${pts} 🏆</span>
            `).join('');
        });

        function iniciarRonda() {
            ganadorDeclarado = false;
            document.getElementById('titulo').innerText = '¡MANTÉN EL EQUILIBRIO!';
            document.getElementById('ganador-overlay').style.display = 'none';
            progresoJugadores = { p1: 0, p2: 0, p3: 0, p4: 0 };
            renderPistas(false);
            sonarInicio();

            cancelAnimationFrame(animationFrameId);
            ultimoFrameMs = performance.now();
            animationFrameId = requestAnimationFrame(actualizarBarras);
        }

        function verificarSupervivencia() {
            if (configJuego.modo !== 'supervivencia') return;
            const cantidad = configJuego.cantidadJugadores || 0;
            if (cantidad <= 1) return;

            let activos = [];
            let conectados = 0;

            for (let i = 1; i <= cantidad; i++) {
                const pid = `p${i}`;
                const j = jugadoresData[pid] || {};
                const pista = document.getElementById(`pista-${pid}`);
                const chip = document.getElementById(`chip-${pid}`);
                if (j.ocupado) conectados++;
                if (j.eliminado) {
                    if (pista) pista.classList.add('eliminado');
                    if (chip) {
                        chip.innerText = 'Eliminado';
                        chip.className = 'estado-chip dead';
                    }
                } else if (j.ocupado) {
                    activos.push(i);
                }
            }

            if (conectados >= 2 && activos.length === 1) {
                declararGanador(activos[0]);
            }
        }

        function actualizarBarras(ahoraMs) {
            if (configJuego.estado !== 'jugando' || ganadorDeclarado) return;

            const dtSecs = Math.min(0.1, (ahoraMs - ultimoFrameMs) / 1000);
            ultimoFrameMs = ahoraMs;

            const duracion = Math.max(1, configJuego.tiempoLimiteSecs || 10);
            const incremento = (100 / duracion) * dtSecs;

            for (let i = 1; i <= configJuego.cantidadJugadores; i++) {
                const pid = `p${i}`;
                const j = jugadoresData[pid] || {};
                const barNode = document.getElementById(`barra-${pid}`);
                const chip = document.getElementById(`chip-${pid}`);
                if (!barNode) continue;

                if (j.eliminado) {
                    barNode.classList.remove('llenando-activa');
                    continue;
                }

                if (j.estaLlenando) {
                    if (configJuego.modo === 'supervivencia') {
                        barNode.style.width = '100%';
                    } else {
                        progresoJugadores[pid] = Math.min(100, progresoJugadores[pid] + incremento);
                        barNode.style.width = progresoJugadores[pid] + '%';
                    }
                    barNode.classList.add('llenando-activa');
                    if (chip) {
                        chip.innerText = 'Estable';
                        chip.className = 'estado-chip ok';
                    }

                    if (configJuego.modo !== 'supervivencia' && progresoJugadores[pid] >= 100) {
                        declararGanador(i);
                        return;
                    }
                } else {
                    barNode.classList.remove('llenando-activa');
                    if (chip && !j.eliminado) {
                        chip.innerText = j.ocupado ? 'Inclinado' : 'Sin tótem';
                        chip.className = 'estado-chip wait';
                    }
                }
            }

            animationFrameId = requestAnimationFrame(actualizarBarras);
        }

        function declararGanador(numeroJugador) {
            if (ganadorDeclarado) return;
            ganadorDeclarado = true;
            configJuego.estado = 'terminado';
            cancelAnimationFrame(animationFrameId);

            const pid = `p${numeroJugador}`;
            const nombreGanador = (configJuego.nombres && configJuego.nombres[pid]) || `JUGADOR ${numeroJugador}`;

            document.getElementById('ganador-texto').innerText = nombreGanador;
            document.getElementById('ganador-overlay').style.display = 'flex';
            sonarVictoria();

            // Notificar a Firebase para que todos los móviles (index.html) terminen la ronda
            db.ref('juego/config/estado').set('terminado').catch(err => console.warn(err));
            db.ref('juego/config/ganador').set({ id: pid, nombre: nombreGanador }).catch(() => {});

            // Sumar punto al marcador de sesión
            const safeKey = nombreGanador.replace(/[.#$\[\]\/]/g, '_');
            db.ref(`juego/marcador/${safeKey}`).transaction(curr => (curr || 0) + 1).catch(() => {});

            const duration = 4000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f1c40f', '#b7950b', '#ffffff'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f1c40f', '#b7950b', '#ffffff'] });
                confetti({ particleCount: 3, angle: 90, spread: 80, origin: { x: 0.5, y: 0 }, colors: ['#000000', '#333333'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function resetUI() {
            db.ref('juego/config/estado').set('esperando').catch(err => console.warn(err));
        }
    </script>
</body>
</html>
