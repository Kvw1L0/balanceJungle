<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Jungle Balance HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --jungle-yellow: #f1c40f;
            --jungle-green: #2ecc71;
            --jungle-red: #e74c3c;
            --jungle-black: #050505;
            --jungle-dark-gray: #1a1a1a;
            --text-light: #ecf0f1;
            --font-header: 'Anton', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --sinuous-border: 24px 12px 24px 12px / 12px 24px 12px 24px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            padding: 16px;
            background-color: var(--jungle-black);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiMyNjI2MjYiIGZpbGwtb3BhY2l0eT0iMC4yIj48cGF0aCBkPSJNMTAgMTBoMjB2MjBIMTB6bTIgMmgxNnYxNkgxMnoiLz48L2c+PC9nPjwvc3ZnPg==');
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .panel {
            background: var(--jungle-dark-gray);
            padding: 24px 28px;
            border-radius: var(--sinuous-border);
            border: 3px solid var(--jungle-yellow);
            box-shadow: 0 0 24px rgba(241, 196, 15, 0.25);
            max-width: 820px;
            width: 100%;
        }

        .header-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(241, 196, 15, 0.25);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        h2 {
            font-family: var(--font-header);
            text-transform: uppercase;
            color: var(--jungle-yellow);
            letter-spacing: 2px;
            font-size: 1.9rem;
            margin: 0;
        }

        .quick-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-mini {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            border: 1px solid rgba(241, 196, 15, 0.5);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            width: auto;
            margin: 0;
            box-shadow: none;
            font-family: var(--font-body);
        }

        .btn-mini:hover {
            background: var(--jungle-yellow);
            color: var(--jungle-black);
            transform: none;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 720px) {
            .layout-grid { grid-template-columns: 1fr; }
            .panel { padding: 18px; }
        }

        .section-box {
            background: rgba(0, 0, 0, 0.35);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .section-title {
            font-family: var(--font-header);
            color: var(--jungle-yellow);
            letter-spacing: 1px;
            font-size: 1rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 8px;
            font-weight: 600;
            color: var(--jungle-yellow);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 9px 11px;
            margin: 4px 0 8px;
            font-size: 0.92rem;
            background: var(--jungle-black);
            border: 1.5px solid rgba(236, 240, 241, 0.4);
            color: var(--text-light);
            border-radius: 8px;
            font-family: var(--font-body);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--jungle-yellow);
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .nombres-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
            margin-top: 6px;
        }

        .actions-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.btn-primary, button.btn-secondary, button.btn-danger {
            width: 100%;
            padding: 13px 14px;
            font-size: 1.05rem;
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            border-radius: var(--sinuous-border);
            transition: all 0.2s ease;
        }

        button.btn-primary {
            background: var(--jungle-yellow);
            color: var(--jungle-black);
            box-shadow: 0 4px 0 #b7950b;
        }
        button.btn-primary:hover { background: #f4d03f; transform: translateY(-2px); }
        button.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #b7950b; }

        button.btn-secondary {
            background: #27ae60;
            color: #fff;
            box-shadow: 0 4px 0 #1e8449;
        }
        button.btn-secondary:hover { background: #2ecc71; transform: translateY(-2px); }

        button.btn-danger {
            background: #c0392b;
            color: #fff;
            box-shadow: 0 4px 0 #922b21;
        }
        button.btn-danger:hover { background: #e74c3c; transform: translateY(-2px); }

        .roster-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .roster-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            border-left: 4px solid #555;
        }

        .roster-item.conectado { border-left-color: var(--jungle-yellow); }
        .roster-item.llenando { border-left-color: var(--jungle-green); background: rgba(46, 204, 113, 0.1); }
        .roster-item.eliminado { border-left-color: var(--jungle-red); opacity: 0.6; }

        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            background: #333;
            color: #ccc;
        }
        .badge.conectado { background: rgba(241, 196, 15, 0.2); color: var(--jungle-yellow); }
        .badge.llenando { background: rgba(46, 204, 113, 0.25); color: var(--jungle-green); }
        .badge.eliminado { background: rgba(231, 76, 60, 0.25); color: var(--jungle-red); }

        .scoreboard-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        #status {
            text-align: center;
            color: var(--jungle-yellow);
            font-weight: 600;
            font-size: 0.88rem;
            margin-top: 12px;
            min-height: 1.3rem;
            padding: 6px 10px;
            border-radius: 8px;
        }

        #status.error {
            color: #ff7675;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        #status.ok {
            color: var(--jungle-green);
            background: rgba(46, 204, 113, 0.12);
        }

        /* Modal QR */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--jungle-dark-gray);
            border: 2px solid var(--jungle-yellow);
            border-radius: 18px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        #qr-box {
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            display: inline-block;
            margin: 14px 0;
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header-bar">
            <h2>Expedition Control</h2>
            <div class="quick-links">
                <button class="btn-mini" type="button" onclick="abrirModalQR()">QR Jugadores</button>
                <a class="btn-mini" href="index.html" target="_blank" rel="noopener">Vista Móvil</a>
                <a class="btn-mini" href="display.html" target="_blank" rel="noopener">Pantalla TV</a>
            </div>
        </div>

        <div class="layout-grid">
            <!-- Columna izquierda: Configuración -->
            <div class="section-box">
                <p class="section-title">Configuración de Ronda</p>

                <div class="row-2">
                    <div>
                        <label for="numJugadores">Exploradores (1-4)</label>
                        <input type="number" id="numJugadores" value="4" min="1" max="4" oninput="generarInputsNombres()">
                    </div>
                    <div>
                        <label for="tiempo">Tiempo (Segundos)</label>
                        <input type="number" id="tiempo" value="15" min="3" max="300">
                    </div>
                </div>

                <div class="row-2">
                    <div>
                        <label for="modo">Modo de Juego</label>
                        <select id="modo" onchange="actualizarVisibilidadTiempo()">
                            <option value="tiempo">Carrera por Tiempo</option>
                            <option value="supervivencia">Último en Pie</option>
                        </select>
                    </div>
                    <div>
                        <label for="dificultad">Dificultad</label>
                        <select id="dificultad">
                            <option value="facil">Fácil (12°)</option>
                            <option value="normal" selected>Normal (8°)</option>
                            <option value="extremo">Extremo (4°)</option>
                        </select>
                    </div>
                </div>

                <label>Nombres de Exploradores</label>
                <div class="nombres-grid" id="nombres-container"></div>

                <div class="actions-stack">
                    <div class="actions-row">
                        <button type="button" class="btn-secondary" onclick="abrirLobby()">1. Abrir Sala</button>
                        <button type="button" class="btn-primary" onclick="iniciarJuego()">2. ¡Iniciar Reto!</button>
                    </div>
                    <button type="button" class="btn-danger" onclick="reiniciarRonda()">Detener / Reiniciar</button>
                </div>

                <div id="status"></div>
            </div>

            <!-- Columna derecha: Monitor en vivo y Marcador -->
            <div style="display: flex; flex-direction: column; gap: 14px;">
                <div class="section-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <p class="section-title" style="margin: 0;">Tótems en Vivo</p>
                        <span id="estado-global-badge" class="badge">Esperando</span>
                    </div>
                    <div id="roster-list" class="roster-list"></div>
                </div>

                <div class="section-box">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <p class="section-title" style="margin: 0;">Marcador de Sesión</p>
                        <button type="button" class="btn-mini" onclick="limpiarMarcador()">Limpiar</button>
                    </div>
                    <div id="scoreboard-list" class="scoreboard-list">
                        <span style="opacity: 0.6; font-size: 0.8rem;">Sin victorias registradas aún.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal QR -->
    <div id="qr-modal" class="modal-backdrop" onclick="cerrarModalQR(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="font-family: var(--font-header); color: var(--jungle-yellow); margin: 0; letter-spacing: 1px;">ESCANEÁ PARA JUGAR</h3>
            <div id="qr-box"></div>
            <p id="qr-url-text" style="font-size: 0.75rem; word-break: break-all; opacity: 0.8; margin: 0 0 14px;"></p>
            <button type="button" class="btn-primary" onclick="cerrarModalQR()">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxwWTtG5Q30H6YAucKMtNAalLer_ShV6k",
            authDomain: "jungle-balance.firebaseapp.com",
            databaseURL: "https://jungle-balance-default-rtdb.firebaseio.com",
            projectId: "jungle-balance",
            storageBucket: "jungle-balance.firebasestorage.app",
            messagingSenderId: "279642328604",
            appId: "1:279642328604:web:8b24a3541f11ad8ca8d9d9",
            measurementId: "G-BR2M1Y2JZF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const nombresPredefinidos = ["Camilo", "Ivette", "Jota", "Verde"];
        let qrGenerado = false;

        function clampJugadores(val) {
            const parsed = parseInt(val, 10);
            if (isNaN(parsed)) return 1;
            return Math.min(4, Math.max(1, parsed));
        }

        function generarInputsNombres() {
            const inputNum = document.getElementById('numJugadores');
            if (inputNum.value !== '') {
                const clamped = clampJugadores(inputNum.value);
                if (parseInt(inputNum.value, 10) !== clamped) {
                    inputNum.value = clamped;
                }
            }
            const num = clampJugadores(inputNum.value || 4);
            const container = document.getElementById('nombres-container');
            const prevValues = {};
            for (let i = 1; i <= 4; i++) {
                const existing = document.getElementById(`nombre-p${i}`);
                if (existing) prevValues[i] = existing.value;
            }

            container.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const defaultName = prevValues[i] || nombresPredefinidos[i - 1] || `Explorador ${i}`;
                container.innerHTML += `
                    <div>
                        <label for="nombre-p${i}">Jugador ${i}</label>
                        <input type="text" id="nombre-p${i}" maxlength="16" value="${defaultName}">
                    </div>
                `;
            }
        }

        function actualizarVisibilidadTiempo() {
            const modo = document.getElementById('modo').value;
            const tiempoInput = document.getElementById('tiempo');
            tiempoInput.disabled = (modo === 'supervivencia');
            tiempoInput.style.opacity = (modo === 'supervivencia') ? '0.45' : '1';
        }

        function setStatus(mensaje, tipo = 'info') {
            const statusNode = document.getElementById('status');
            statusNode.className = tipo === 'error' ? 'error' : (tipo === 'ok' ? 'ok' : '');
            statusNode.innerText = mensaje;
        }

        function manejarErrorFirebase(err) {
            console.error('Firebase error:', err);
            if (err && (err.code === 'PERMISSION_DENIED' || String(err.message).includes('PERMISSION_DENIED'))) {
                setStatus('Error de permisos en Firebase (PERMISSION_DENIED). Actualiza las reglas de Realtime Database.', 'error');
            } else {
                setStatus('Error de conexión con Firebase. Intenta nuevamente.', 'error');
            }
        }

        function leerConfigFormulario() {
            const numInput = document.getElementById('numJugadores');
            const numJugadores = clampJugadores(numInput.value);
            numInput.value = numJugadores;

            const tiempoInput = document.getElementById('tiempo');
            let tiempo = parseInt(tiempoInput.value, 10);
            if (isNaN(tiempo) || tiempo < 3) {
                tiempo = 10;
                tiempoInput.value = tiempo;
            }

            const nombres = {};
            for (let i = 1; i <= numJugadores; i++) {
                const val = (document.getElementById(`nombre-p${i}`)?.value || '').trim();
                nombres[`p${i}`] = val || `Explorador ${i}`;
            }

            return {
                cantidadJugadores: numJugadores,
                tiempoLimiteSecs: tiempo,
                modo: document.getElementById('modo').value,
                dificultad: document.getElementById('dificultad').value,
                nombres
            };
        }

        function crearJugadoresIniciales() {
            return {
                p1: { estaLlenando: false, ocupado: false, listo: false, eliminado: false },
                p2: { estaLlenando: false, ocupado: false, listo: false, eliminado: false },
                p3: { estaLlenando: false, ocupado: false, listo: false, eliminado: false },
                p4: { estaLlenando: false, ocupado: false, listo: false, eliminado: false }
            };
        }

        function abrirLobby() {
            const cfg = leerConfigFormulario();
            setStatus('Abriendo sala de espera...');

            Promise.all([
                db.ref('juego/jugadores').set(crearJugadoresIniciales()),
                db.ref('juego/config').set({
                    ...cfg,
                    estado: 'lobby',
                    ganador: null
                })
            ]).then(() => {
                setStatus('Sala abierta. Los jugadores ya pueden vincular sus tótems.', 'ok');
            }).catch(manejarErrorFirebase);
        }

        function iniciarJuego() {
            const cfg = leerConfigFormulario();
            setStatus('Iniciando desafío...');

            db.ref('juego/config').once('value').then(snap => {
                const actual = snap.val();
                const yaEnLobby = actual && actual.estado === 'lobby';

                const promesas = [
                    db.ref('juego/config').set({
                        ...cfg,
                        estado: 'jugando',
                        ganador: null,
                        iniciadoEn: Date.now()
                    })
                ];

                if (!yaEnLobby) {
                    promesas.push(db.ref('juego/jugadores').set(crearJugadoresIniciales()));
                }

                return Promise.all(promesas);
            }).then(() => {
                setStatus('¡RETO INICIADO EN PANTALLA!', 'ok');
            }).catch(manejarErrorFirebase);
        }

        function reiniciarRonda() {
            setStatus('Reiniciando sala...');
            Promise.all([
                db.ref('juego/jugadores').set(crearJugadoresIniciales()),
                db.ref('juego/config/estado').set('esperando'),
                db.ref('juego/config/ganador').set(null)
            ]).then(() => {
                setStatus('Ronda detenida y sala reiniciada.', 'ok');
            }).catch(manejarErrorFirebase);
        }

        function limpiarMarcador() {
            db.ref('juego/marcador').remove().catch(manejarErrorFirebase);
        }

        // Escuchar estado en tiempo real para el monitor del admin
        let ultimaConfig = { cantidadJugadores: 4, nombres: {}, estado: 'esperando' };
        let ultimosJugadores = {};

        function renderRoster() {
            const roster = document.getElementById('roster-list');
            const badgeGlobal = document.getElementById('estado-global-badge');
            badgeGlobal.innerText = (ultimaConfig.estado || 'esperando').toUpperCase();
            badgeGlobal.className = 'badge ' + (ultimaConfig.estado === 'jugando' ? 'llenando' : (ultimaConfig.estado === 'lobby' ? 'conectado' : ''));

            const cantidad = ultimaConfig.cantidadJugadores || 4;
            roster.innerHTML = '';

            for (let i = 1; i <= cantidad; i++) {
                const pid = `p${i}`;
                const nombre = (ultimaConfig.nombres && ultimaConfig.nombres[pid]) || nombresPredefinidos[i - 1] || `Explorador ${i}`;
                const j = ultimosJugadores[pid] || {};

                let clase = '';
                let texto = 'Libre';
                if (j.eliminado) {
                    clase = 'eliminado';
                    texto = 'Eliminado';
                } else if (j.estaLlenando) {
                    clase = 'llenando';
                    texto = 'Equilibrado';
                } else if (j.listo) {
                    clase = 'conectado';
                    texto = 'Calibrado';
                } else if (j.ocupado) {
                    clase = 'conectado';
                    texto = 'Conectado';
                }

                roster.innerHTML += `
                    <div class="roster-item ${clase}">
                        <strong>${nombre}</strong>
                        <span class="badge ${clase}">${texto}</span>
                    </div>
                `;
            }
        }

        db.ref('juego/config').on('value', snap => {
            if (snap.exists()) {
                ultimaConfig = snap.val();
                renderRoster();
            }
        }, err => console.warn('Lectura config:', err));

        db.ref('juego/jugadores').on('value', snap => {
            ultimosJugadores = snap.val() || {};
            renderRoster();
        }, err => console.warn('Lectura jugadores:', err));

        db.ref('juego/marcador').on('value', snap => {
            const list = document.getElementById('scoreboard-list');
            const data = snap.val();
            if (!data) {
                list.innerHTML = '<span style="opacity: 0.6; font-size: 0.8rem;">Sin victorias registradas aún.</span>';
                return;
            }
            const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
            list.innerHTML = entries.map(([nombre, pts]) => `
                <div class="score-row">
                    <span>${nombre}</span>
                    <strong style="color: var(--jungle-yellow);">${pts} 🏆</strong>
                </div>
            `).join('');
        });

        function abrirModalQR() {
            const modal = document.getElementById('qr-modal');
            const playerUrl = new URL('index.html', window.location.href).href;
            document.getElementById('qr-url-text').innerText = playerUrl;

            if (!qrGenerado && typeof QRCode !== 'undefined') {
                const qrBox = document.getElementById('qr-box');
                qrBox.innerHTML = '';
                new QRCode(qrBox, {
                    text: playerUrl,
                    width: 200,
                    height: 200,
                    colorDark: '#050505',
                    colorLight: '#ffffff'
                });
                qrGenerado = true;
            }
            modal.style.display = 'flex';
        }

        function cerrarModalQR() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        generarInputsNombres();
        renderRoster();
    </script>
</body>
</html>
